<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наши услуги</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .service-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .service-card h2 {
            margin-top: 0;
        }

        .description {
            color: #666;
            line-height: 1.5;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .duration {
            color: #777;
            margin-top: 8px;
        }

        .book-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .book-button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<header>
    <h1>Система бронирования</h1>
</header>

<main class="container">

    <h2>Наши услуги</h2>

    <div class="services">

        {% for service in services %}

            <div class="service-card">

                <h2>{{ service.name }}</h2>

                <p class="description">
                    {{ service.description }}
                </p>

                <div class="price">
                    {{ service.price }} €
                </div>

                <div class="duration">
                    Длительность: {{ service.duration }} минут
                </div>

                <a href="#" class="book-button">
                    Забронировать
                </a>

            </div>

        {% empty %}

            <p>Сейчас доступных услуг нет.</p>

        {% endfor %}

    </div>

</main>

</body>
</html>
