{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{% static 'services/style.css' %}">

    <title>Наши услуги</title>

</head>

<body>

<header>
    <h1>Система бронирования</h1>
</header>

<main class="container">

    <h2>Наши услуги</h2>

    <div class="services">

        {% for service in services %}

            <div class="service-card">

                <h2>{{ service.name }}</h2>

                <p class="description">
                    {{ service.description }}
                </p>

                <div class="price">
                    {{ service.price }} €
                </div>

                <div class="duration">
                    Длительность: {{ service.duration }} минут
                </div>

                <a href="#" class="book-button">
                    Забронировать
                </a>

            </div>

        {% empty %}

            <p>Сейчас доступных услуг нет.</p>

        {% endfor %}

    </div>

</main>

</body>
</html>
