{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Booking System{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'services/style.css' %}"
    >
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a
            href="{% url 'service_list' %}"
            class="site-logo"
        >
            <span class="logo-mark">B</span>

            <span class="logo-text">
                BOOKING
            </span>
        </a>


        <nav class="site-nav">

            <a href="{% url 'service_list' %}">
                Услуги
            </a>


            {% if user.is_authenticated %}

                <a href="{% url 'profile' %}">
                    Личный кабинет
                </a>

                <a
                    href="{% url 'logout' %}"
                    class="nav-logout"
                >
                    Выйти
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    Войти
                </a>

                <a
                    href="{% url 'register' %}"
                    class="nav-register"
                >
                    Регистрация
                </a>

            {% endif %}

        </nav>

    </div>

</header>


<main class="page-content">

    {% block content %}
    {% endblock %}

</main>


<footer class="site-footer">

    <div class="footer-inner">

        <span>
            © 2026 Booking System
        </span>

        <span>
            Онлайн-запись
        </span>

    </div>

</footer>

</body>
</html>
